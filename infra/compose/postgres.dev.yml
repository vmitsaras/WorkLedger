name: workledger-dev

services:
  postgres:
    image: postgres:18.4-trixie
    container_name: workledger-postgres-dev
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WORKLEDGER_POSTGRES_PORT:-54329}:5432'
    environment:
      POSTGRES_DB: workledger_dev
      POSTGRES_USER: workledger_owner
      POSTGRES_PASSWORD: workledger_owner_password
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - workledger-postgres-data:/var/lib/postgresql
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  workledger-postgres-data:
